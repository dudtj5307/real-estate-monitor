# 네이버 부동산 → 텔레그램 리포트 설정
#
# 단지번호는 https://fin.land.naver.com/complexes/{번호} 의 숫자 부분입니다.

telegram:
  # 이 저장소는 public 이므로 여기에 값을 적으면 누구나 볼 수 있습니다.
  # 아래 두 값은 환경변수 / GitHub Secret 으로 전달하세요.
  #   TELEGRAM_BOT_TOKEN  (필수)
  #   TELEGRAM_CHAT_ID    (필수)
  # chat_id 는 환경변수가 없을 때만 이 값을 폴백으로 씁니다. 비워두세요.
  chat_id: ""

# 수집은 넓게 하고(스냅샷에는 전 매물이 남습니다), 표시 단계에서만 좁힙니다.
# 아래를 좁히면 대시보드 UI 에서 다시 넓힐 수 없으니 꼭 필요한 기준만 겁니다.
defaults:
  trade_types: [매매, 전세]   # 매매 / 전세 / 월세 / 단기임대
  area_min: 56               # 전용면적 ㎡ 하한 (null 이면 제한 없음)
  area_max: 100              # 전용면적 ㎡ 상한
  pyeong_groups: []          # 비우면 전체 평형. UI에서 20평대/30평대 선택
  price_max: null            # 만원 단위 상한. 예) 100000 = 10억
  price_min: null

site:
  # 대시보드의 "지금 갱신" 버튼이 이 저장소의 Actions 실행 화면으로 연결됩니다.
  # 비워두면 버튼이 표시되지 않습니다.
  repo: "dudtj5307/real-estate-monitor"

  # 대시보드 금액대 입력칸의 기본값 (만원 단위). 페이지에서 언제든 바꿀 수 있습니다.
  # null 이면 제한 없이 시작합니다.
  price_focus: [90000, 110000]   # 9억 ~ 11억

complexes:
  - name: 성복역현대홈타운
    number: "8692"

  - name: 성복역아이파크
    number: "3707"

  # 단지별로 defaults 를 덮어쓸 수 있습니다
  # - name: 다른단지
  #   number: "12345"
  #   trade_types: [매매, 전세]
  #   area_min: 56
  #   area_max: 100
  #   price_max: 100000
