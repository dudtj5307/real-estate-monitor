name: 텔레그램 전송

# 리포트를 **만드는** 주체(집 라즈베리파이)와 **보내는** 주체(여기)가 분리돼 있다.
# 24시간 켜진 집 기기에 토큰을 두지 않기 위해서다 — Pi 는 완성된 메시지를
# data/outbox.json 으로 push 하고, 전송은 저장소 secret 을 가진 여기서 한다
# (DESIGN-PI.md §5.4).
#
# ⚠️ 이 워크플로가 리포트의 **유일한** 전송 경로다. Pi 의 push 가 실패하면 그날
#    알림이 통째로 없고, 그 사실은 watchdog.yml 이 잡는다.
#
# ⚠️ Pi 는 반드시 **deploy key(SSH)** 로 push 해야 한다. Actions 의 GITHUB_TOKEN 으로
#    만든 push 는 다른 워크플로를 트리거하지 않는다(GitHub 의 무한루프 방지). Pi 의
#    인증을 그쪽으로 바꾸면 알림이 조용히 끊긴다 — 커밋은 잘 올라오는데 이 워크플로만
#    돌지 않아 원인을 찾기 어렵다. 뒤집어 말하면, watchdog 폴백의 커밋이 실수로
#    이 워크플로를 깨우는 일도 없다.
on:
  push:
    branches: [main]
    paths:
      - "data/outbox.json"

# 아무것도 쓰지 않는다 (최소 권한).
permissions:
  contents: read

concurrency:
  # 순서가 뒤집히면 오래된 리포트가 나중에 도착한다. 취소하지 말고 줄을 세운다.
  group: telegram-notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          box=data/outbox.json

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::secret 이 비어 있습니다 — Settings → Secrets and variables → Actions 에서 등록하세요"
            exit 1
          fi

          # 스키마가 바뀌었는데 여기가 안 바뀐 경우. 엉뚱한 메시지를 보내느니 멈춘다.
          version=$(jq -r '.version // 0' "$box")
          if [ "$version" != "1" ]; then
            echo "::error::모르는 outbox 버전 [$version] — 전송하지 않습니다 (src/outbox.py 확인)"
            exit 1
          fi

          kind=$(jq -r '.kind // "?"' "$box")
          at=$(jq -r '.generated_at // "?"' "$box")
          count=$(jq '.chunks | length' "$box")
          echo "kind=$kind · 생성 $at · $count 조각"

          if [ "$count" -eq 0 ]; then
            echo "::error::보낼 내용이 없습니다 — outbox.json 의 chunks 가 비었습니다"
            exit 1
          fi

          for i in $(seq 0 $((count - 1))); do
            if [ "$i" -gt 0 ]; then
              sleep 1   # Bot API 초당 제한 회피
            fi
            text=$(jq -r ".chunks[$i]" "$box")
            res=$(curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "disable_web_page_preview=true" \
              --data-urlencode "text=${text}")

            if [ "$(printf '%s' "$res" | jq -r '.ok')" != "true" ]; then
              # 응답 전체를 찍으면 요청 URL 이 섞여 나올 수 있다. 사유만 꺼낸다.
              why=$(printf '%s' "$res" | jq -r '.description // "알 수 없는 오류"')
              echo "::error::텔레그램 전송 실패 — $why"
              exit 1
            fi
          done

          echo "### 텔레그램 전송 완료 ($kind · $count 조각)" >> "$GITHUB_STEP_SUMMARY"
