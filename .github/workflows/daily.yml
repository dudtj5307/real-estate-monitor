name: 부동산 일일 리포트

on:
  schedule:
    # 네이버 429 는 IP 단위이고 40분 넘게 지속된다. 같은 job 안에서 재시도해 봐야
    # IP 가 그대로라 못 뚫는다 → **하루 여러 번 시도해 매번 다른 러너 IP 를 받는다.**
    # 막힌 실행은 첫 요청에서 바로 끝나므로(IPBlocked) 시도 1회당 1분도 안 걸린다.
    # 한 번 성공하면 --skip-if-done 으로 나머지는 즉시 종료한다(중복 알림 없음).
    #
    # 정각은 전 세계 워크플로가 몰려 러너 IP 오염이 심하므로 어중간한 분을 쓴다.
    # (Actions cron 은 5~30분 지연될 수 있다)
    - cron: "37 23 * * *"   # KST 08:37
    - cron: "9 0 * * *"     # KST 09:09
    - cron: "43 1 * * *"    # KST 10:43
    - cron: "23 3 * * *"    # KST 12:23
    - cron: "17 6 * * *"    # KST 15:17
    - cron: "51 10 * * *"   # KST 19:51
    - cron: "29 13 * * *"   # KST 22:29
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # 차단이면 즉시 끝나고, 성공해도 단지 간 대기(25초)가 전부다
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # secret 이 비어 있으면 리포트가 조용히 콘솔로만 나간다. 먼저 확인한다.
      - name: 텔레그램 secret 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=""
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then missing="$missing TELEGRAM_BOT_TOKEN"; fi
          if [ -z "$TELEGRAM_CHAT_ID" ];   then missing="$missing TELEGRAM_CHAT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::secret 이 비어 있습니다:$missing — Settings → Secrets and variables → Actions 에서 등록하세요"
            exit 1
          fi
          echo "secret 2개 확인됨"

      # 예약 실행이 cron 시각에 정확히 몰리면 그 순간의 러너 IP 풀도 함께 몰린다.
      # 0~4분 흩뿌려 남들과 같은 창에 들어가지 않게 한다.
      - name: 시작 시각 흩뿌리기
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 240))

      - name: 리포트 실행
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 예약 실행은 오늘 이미 수집한 단지를 건너뛴다.
        # 수동 실행("지금 갱신")은 언제나 새로 수집한다.
        #
        # 종료 코드 2 = 실행 IP 차단. 예상된 상황이고 다음 예약 실행이 다른 IP 로
        # 재시도하므로 job 을 실패로 만들지 않는다 (매번 빨간 X + 메일이 오면
        # 정작 진짜 고장을 놓친다).
        run: |
          set +e
          python -m src.main ${{ github.event_name == 'schedule' && '--skip-if-done' || '' }}
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::네이버가 이 러너 IP 를 차단했습니다(429). 다음 예약 실행이 다른 IP 로 재시도합니다."
            exit 0
          fi
          exit $code

      # 실패해도 돌려야 한다 — 실패 알림 기록(data/state.json)이 커밋돼야
      # 오늘 남은 예약 실행이 같은 알림을 또 보내지 않는다.
      - name: 스냅샷 · 대시보드 커밋
        if: always()
        run: |
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 매물 스냅샷·대시보드 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      # 파이썬이 예외로 죽으면(설정 오류·의존성 문제 등) 앱이 보내는 실패 알림도
      # 못 나간다. 그 경우에만 워크플로가 직접 알린다.
      - name: 예상 못한 실패 알림
        if: failure() && steps.run.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=🛠 부동산 모니터가 예상 못한 오류로 멈췄습니다 (429 차단이 아닙니다).
          로그: ${RUN_URL}" > /dev/null
